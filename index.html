<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 헬퍼 산업·직무 추천</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f7fb}
#appFrame{display:block;width:100%;height:100%;border:0;background:#f4f7fb}
.fallback{position:fixed;inset:auto 12px 12px 12px;padding:10px 12px;border-radius:10px;background:#fff;border:1px solid #dfe5ee;font:13px system-ui;color:#475467;display:none}
</style>
</head>
<body>
<iframe id="appFrame" title="AI 헬퍼 산업·직무 추천" src="AI헬퍼_산업직무_추천_V3_7.html"></iframe>
<div class="fallback" id="fallback">앱을 불러오지 못했습니다. 새로고침해 주세요.</div>
<script>
(() => {
  const frame = document.getElementById('appFrame');
  const fallback = document.getElementById('fallback');
  let loaded = false;
  frame.addEventListener('load', () => {
    loaded = true;
    try {
      const d = frame.contentDocument;
      if (!d || d.getElementById('googleDriveCollectorScript')) return;
      const s = d.createElement('script');
      s.id = 'googleDriveCollectorScript';
      s.src = 'collector.js?v=20260912';
      d.body.appendChild(s);
    } catch (err) {
      console.error('collector injection failed', err);
      fallback.style.display = 'block';
    }
  });
  setTimeout(() => { if (!loaded) fallback.style.display = 'block'; }, 12000);
})();
</script>
</body>
</html>
